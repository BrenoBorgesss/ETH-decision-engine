# Modo demonstração (cryptoagent --demo ...): roda SEM internet e SEM chave da Binance,
# usando a amostra de candles públicos de exemplos/historico.
# Este arquivo só lista o que muda em relação ao config.yaml.

mercado:
  simbolo_analise: ETHBRL        # no demo, análise e operação no mesmo par (a amostra só tem ETHBRL)
  pares_candidatos: [ETHBRL]
  par_operacao: ETHBRL

historico:
  pasta: exemplos/historico
  intervalos:
    ETHBRL: [1m, 5m, 15m, 1h, 4h]
    ETHUSDT: []                  # lista vazia = par fora do demo
    USDTBRL: []

custos:
  banco: data/demo/costs.sqlite  # não existe: o demo usa o spread padrão do config, sem medições suas

conta:
  banco: data/demo/agent.sqlite  # o demo nunca lê nem grava no banco da sua conta

sazonalidade:
  relatorio_pasta: data/demo/reports

backtest:
  pares: [ETHBRL]
  meses_treino: 1                # a amostra tem ~3 meses: 1 de treino (agosto) e 1 de teste (setembro)
  meses_teste: 1
  relatorio_pasta: data/demo/reports

modelo:
  pasta: data/demo/models
  exemplos_min_treino: 20        # só no demo: a amostra tem 1 mês de treino (no uso normal, 200)

aprendizado:
  pasta: data/demo/learning
  hipoteses: []                # a amostra é curta demais para a hipótese do setup 1h
  operacoes_min: 5             # só no demo (no uso normal, 30): a amostra tem 1 mês fora da amostra
  dias_min: 20

paper:
  banco: data/demo/simulacao.sqlite
  replay_pasta: data/demo/replay
  variantes: [padrao]          # a amostra é curta: só a estratégia padrão

logs:
  pasta: data/demo/logs
