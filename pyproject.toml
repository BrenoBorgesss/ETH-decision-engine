[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoagent"
version = "0.1.0"
description = "Assistente de decisão para cripto (somente leitura): COMPRAR / VENDER / ESPERAR. Não envia ordens."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BrenoBorgesss" }]
keywords = ["cripto", "ethereum", "binance", "backtest", "walk-forward", "paper-trading", "reversao-a-media", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Education",
  "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "tzdata>=2024.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "scikit-learn>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff==0.17.4", "pre-commit>=4"]

[project.scripts]
cryptoagent = "cryptoagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryptoagent = ["dashboard/static/*", "dashboard/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["lento: teste de ponta a ponta demorado (roda no CI; para pular localmente: pytest -m \"not lento\")"]

# Lint e formatação: ruff (o formatador do ruff segue o estilo do black).
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/cryptoagent/dashboard/static"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle e pyflakes
  "I",             # ordem dos imports
  "B",             # bugbear: armadilhas comuns
  "UP",            # sintaxe moderna para a versão mínima do Python
  "SIM", "C4", "PIE",
  "RUF",
  "C90",           # complexidade (mccabe)
  "D100", "D101", "D102", "D103", "D106", "D419",  # docstrings dos itens públicos
  "PLR0124", "PLW0127", "PLW1510",
]
ignore = [
  "E501",                      # comprimento de linha fica a cargo do formatador (textos e comentários longos são aceitos)
  "RUF001", "RUF002", "RUF003",  # textos em português usam ×, −, – de propósito
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D103"]

[tool.coverage.run]
source = ["cryptoagent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
